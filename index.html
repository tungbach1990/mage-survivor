<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Mage Survivor — Idle RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="ui.css?v=mw94uhhp">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){var B="mw94uhhp";try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(v){if(v&&v.build&&v.build!==B){var u=location.pathname+"?v="+v.build+location.hash;if(sessionStorage.getItem("reloadTo")!==v.build){sessionStorage.setItem("reloadTo",v.build);location.replace(u)}}}).catch(function(){})}catch(e){}})();</script>
</head>
<body>
  <div id="stage">
    <div id="top">
      <div class="row1">
        <b id="hero-name">Pháp sư</b> <span id="hero-lv">Lv 1</span>
        <span class="spacer"></span>
        <span id="gold">💰 0</span> <span id="crys">💎 0</span>
        <button id="speed-btn" title="Tốc độ (x1 / x2 / x4 / x8)">⏩ x1</button>
      </div>
      <div class="bar xp"><div id="xp-fill" class="fill"></div><span id="xp-text"></span></div>
      <div class="bars2">
        <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text"></span></div>
        <div class="bar sp"><div id="sp-fill" class="fill"></div><span id="sp-text"></span></div>
      </div>
      <div class="row1 small"><span id="map-name">Đồng cỏ</span><span class="spacer"></span><span id="boss-text">Boss: 0/100</span></div>
      <div class="bar boss"><div id="boss-fill" class="fill"></div></div>
    </div>
    <canvas id="screen" width="180" height="200"></canvas>
    <div id="skillbar"></div>
    <nav id="tabs">
      <button data-tab="skills">⚔<small>Kỹ năng</small></button>
      <button data-tab="stats">📊<small>Chỉ số</small><i id="stats-dot" class="dot" hidden></i></button>
      <button data-tab="gear">🎒<small>Trang bị</small><i id="gear-dot" class="dot" hidden></i></button>
      <button data-tab="maps">🗺<small>Bản đồ</small></button>
      <button data-tab="heroes">🧍<small>Nhân vật</small></button>
      <button data-tab="more">★<small>Khác</small></button>
    </nav>
    <div id="panel"></div>
    <div id="toasts"></div>
    <div id="offline" class="overlay" hidden><div class="box"><h2>Trong lúc vắng mặt</h2><div id="offline-body"></div><button id="offline-ok">Nhận</button></div></div>
    <div id="loading">Đang tải…</div>
  </div>
  <script type="module" src="src/app.js?v=mw94uhhp"></script>
</body>
</html>
